services:
    web:
        build:
            context: .
            target: web
        ports:
            - "8484:8484"
        volumes:
            - data:/data
        restart: unless-stopped

    scraper:
        build:
            context: .
            target: scraper
        volumes:
            - data:/data
        restart: unless-stopped

    compactor:
        build:
            context: .
            target: compactor
        volumes:
            - data:/data
        restart: unless-stopped

volumes:
    data:
