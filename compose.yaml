services:
    web:
        build:
            context: .
            target: web
        ports:
            - "8484:8484"
        environment:
            REDIS_URL: redis://redis:6379
        volumes:
            - data:/data
        depends_on:
            - redis
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --save ""
        restart: unless-stopped

    scraper:
        build:
            context: .
            target: scraper
        volumes:
            - data:/data
        restart: unless-stopped

    compactor:
        build:
            context: .
            target: compactor
        volumes:
            - data:/data
        restart: unless-stopped

volumes:
    data:
